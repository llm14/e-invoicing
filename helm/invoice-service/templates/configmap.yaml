apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "invoice-service.fullname" . }}
  labels:
    {{- include "invoice-service.labels" . | nindent 4 }}
data:
  DB_URL: {{ .Values.database.url | quote }}
  DB_USER: {{ .Values.database.username | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  TEMPORAL_TARGET: {{ .Values.temporal.target | quote }}
