apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: local-infra
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: local-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: local-infra
    spec:
      # Service-link env vars (TEMPORAL_PORT=tcp://...) collide with Temporal's own settings
      enableServiceLinks: false
      initContainers:
        # auto-setup creates its databases on start, so Postgres must already accept connections
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do echo waiting for postgres; sleep 2; done
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - { name: DB, value: "postgres12" }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: "postgres" }
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 40
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: local-infra
spec:
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: local-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/part-of: local-infra
    spec:
      # Without this, the Service named temporal-ui injects TEMPORAL_UI_PORT=tcp://...,
      # which breaks the UI's config parsing
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: {{ .Values.temporalUi.image }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
