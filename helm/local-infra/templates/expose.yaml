{{- if .Values.expose.enabled }}
# Docker Desktop binds LoadBalancer Services to localhost, so these replace `kubectl port-forward`.
# They are separate from the in-cluster Services (postgres:5432, temporal-ui:8080), which other pods use.
apiVersion: v1
kind: Service
metadata:
  name: postgres-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: local-infra
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: {{ .Values.expose.postgresPort }}
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui-local
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: local-infra
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - name: http
      port: {{ .Values.expose.temporalUiPort }}
      targetPort: http
{{- end }}
