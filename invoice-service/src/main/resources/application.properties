# Infrastructure comes from the root docker-compose.yml (`docker compose up -d`),
# not from Quarkus Dev Services.
quarkus.devservices.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/einvoicing}
quarkus.datasource.username=${DB_USER:einvoicing}
quarkus.datasource.password=${DB_PASSWORD:einvoicing}

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Inbound: invoices submitted as JSON (same shape as POST /invoices). Failures go to the DLQ.
mp.messaging.incoming.invoices-submitted.connector=smallrye-kafka
mp.messaging.incoming.invoices-submitted.topic=invoices.submitted
mp.messaging.incoming.invoices-submitted.group.id=invoice-service
mp.messaging.incoming.invoices-submitted.auto.offset.reset=earliest
mp.messaging.incoming.invoices-submitted.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.invoices-submitted.failure-strategy=dead-letter-queue
mp.messaging.incoming.invoices-submitted.dead-letter-queue.topic=invoices.submitted.dlq

# Outbound: one event per invoice state change, published from the outbox table.
mp.messaging.outgoing.invoice-events.connector=smallrye-kafka
mp.messaging.outgoing.invoice-events.topic=invoices.events
mp.messaging.outgoing.invoice-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.invoice-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.invoice-events.max.block.ms=5000
mp.messaging.outgoing.invoice-events.request.timeout.ms=5000
mp.messaging.outgoing.invoice-events.delivery.timeout.ms=10000

app.temporal.target=${TEMPORAL_TARGET:localhost:7233}
app.temporal.task-queue=invoice-tasks

# Simulated recipient: probability (0.0-1.0) that a delivery attempt fails, to exercise retries.
app.delivery.failure-rate=0.0

# Signing key. Without a keystore an ephemeral key is generated at startup (development only).
# app.signing.keystore=/path/to/signer.p12
# app.signing.password=...
# app.signing.alias=signer
